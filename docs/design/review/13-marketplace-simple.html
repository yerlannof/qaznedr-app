    <title>13 · Техника и услуги — рабочий прототип</title>
    <style>
      @font-face {
        font-family: Plex;
        src: url('../../../public/brand/fonts/IBMPlexSans-Regular.woff2');
      }
      @font-face {
        font-family: Plex;
        src: url('../../../public/brand/fonts/IBMPlexSans-SemiBold.woff2');
        font-weight: 600;
      }
      @font-face {
        font-family: Source;
        src: url('../../../public/brand/fonts/SourceSerif4Display-Regular.ttf.woff2');
      }
      :root {
        --bg: #e9ece6;
        --surface: #f8f9f5;
        --ink: #253740;
        --muted: #43585f;
        --line: #9aa8a5;
        --accent: #dde55e;
        --soft: #dbe2dc;
        --error: #9c3027;
        font-family: Plex, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      body[data-theme='dark'] {
        --bg: #17272e;
        --surface: #253740;
        --ink: #f0f2ec;
        --muted: #cbd7d1;
        --line: #82999c;
        --soft: #354a52;
        --error: #ffb2a7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        color: var(--ink);
        background: var(--bg);
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button,
      input,
      select,
      textarea {
        min-height: 48px;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #a1ac15;
        outline-offset: 2px;
      }
      a {
        color: inherit;
      }
      p {
        line-height: 1.55;
      }
      h1,
      h2,
      h3 {
        line-height: 1.16;
      }
      h1 {
        font:
          normal clamp(2rem, 4vw, 3.5rem) / 1.07 Source,
          Georgia,
          serif;
        margin: 0 0 16px;
      }
      h2 {
        font-size: 1.55rem;
        margin: 0 0 16px;
      }
      h3 {
        font-size: 1.12rem;
        margin: 0 0 9px;
      }
      .shell {
        max-width: 1260px;
        margin: auto;
        padding: 0 24px;
      }
      .top {
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .topinner {
        min-height: 82px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .logo {
        width: 176px;
        max-width: 43vw;
      }
      .tools {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .tools select,
      .tools button {
        padding: 0 12px;
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .tools button {
        min-width: 80px;
      }
      .demo {
        background: var(--accent);
        color: #253740;
        padding: 12px 24px;
        font-weight: 600;
        font-size: 0.89rem;
        text-align: center;
      }
      .nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 25px 0;
      }
      .nav button,
      .pill {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        padding: 0 20px;
        font-weight: 600;
      }
      .nav button[aria-selected='true'],
      .pill.active {
        background: var(--ink);
        color: var(--bg);
      }
      main {
        padding-bottom: 70px;
      }
      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 24px;
        align-items: end;
        padding: 26px 0 32px;
        border-bottom: 1px solid var(--line);
      }
      .eyebrow {
        font-size: 0.77rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--muted);
      }
      .intro {
        font-size: 1.1rem;
        max-width: 680px;
        margin: 0;
      }
      .heroaside {
        border-left: 3px solid var(--accent);
        padding: 15px 20px;
        background: var(--surface);
      }
      .heroaside p {
        margin: 5px 0 0;
      }
      .filters {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        align-items: end;
        padding: 25px 0;
      }
      .field {
        display: grid;
        gap: 7px;
      }
      .field label,
      .field legend {
        font-weight: 600;
        font-size: 0.96rem;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 0;
        color: var(--ink);
        padding: 10px 13px;
      }
      .field textarea {
        min-height: 100px;
        resize: vertical;
      }
      .hint {
        font-size: 0.82rem;
        color: var(--muted);
        margin: 0;
      }
      .cataloghead {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
        margin: 10px 0 15px;
      }
      .cataloghead h2 {
        margin: 0;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 15px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }
      .cardtop {
        min-height: 115px;
        background: var(--soft);
        padding: 18px;
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 10px;
      }
      .type,
      .demotag {
        font-size: 0.73rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .type {
        border: 1px solid var(--ink);
        padding: 7px 9px;
      }
      .demotag {
        background: var(--accent);
        color: #253740;
        padding: 7px 9px;
      }
      .cardbody {
        padding: 19px;
        display: flex;
        flex: 1;
        flex-direction: column;
      }
      .cardbody p {
        margin: 0 0 9px;
      }
      .specs {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .price {
        font-weight: 600;
        font-size: 1.18rem;
        margin-top: auto !important;
        padding-top: 16px;
      }
      .card button {
        margin: 0 19px 19px;
      }
      .primary,
      .secondary {
        border: 1px solid var(--ink);
        padding: 0 20px;
        font-weight: 600;
        min-height: 50px;
      }
      .primary {
        background: var(--ink);
        color: var(--bg);
      }
      .secondary {
        background: transparent;
        color: var(--ink);
      }
      .sulfur {
        background: var(--accent);
        color: #253740;
        border-color: var(--accent);
      }
      .empty {
        padding: 30px;
        background: var(--surface);
        border: 1px solid var(--line);
      }
      .flow {
        max-width: 830px;
        margin: 28px auto;
      }
      .progress {
        display: flex;
        gap: 8px;
        margin: 18px 0 26px;
      }
      .progress span {
        height: 7px;
        background: var(--line);
        flex: 1;
      }
      .progress span.on {
        background: var(--accent);
      }
      .stepcount {
        font-size: 0.9rem;
        font-weight: 600;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        padding: clamp(20px, 4vw, 38px);
      }
      .panel h2 {
        font:
          normal clamp(1.65rem, 3vw, 2.35rem) / 1.12 Source,
          Georgia,
          serif;
      }
      .stack {
        display: grid;
        gap: 18px;
      }
      .choicegrid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .choice {
        position: relative;
      }
      .choice input {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        inset: 0;
        cursor: pointer;
      }
      .choice span {
        display: flex;
        align-items: center;
        min-height: 82px;
        padding: 15px;
        background: var(--bg);
        border: 2px solid var(--line);
        font-weight: 600;
      }
      .choice input:checked + span {
        border-color: var(--ink);
        box-shadow: inset 0 0 0 3px var(--accent);
      }
      .choice input:focus-visible + span {
        outline: 3px solid #a1ac15;
        outline-offset: 2px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 26px;
      }
      .actions button {
        min-width: 145px;
      }
      .error {
        color: var(--error);
        font-size: 0.86rem;
        margin: 4px 0 0;
        font-weight: 600;
      }
      .note {
        border-left: 4px solid var(--accent);
        background: var(--bg);
        padding: 14px 18px;
      }
      .help {
        margin-top: 22px;
        padding: 20px;
        border: 1px solid var(--line);
        background: var(--soft);
      }
      .help p {
        margin: 5px 0 15px;
      }
      .summary {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 10px 15px;
        margin: 0;
      }
      .summary dt {
        color: var(--muted);
      }
      .summary dd {
        margin: 0;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .result {
        padding: 25px;
        background: var(--soft);
        border-left: 5px solid var(--accent);
      }
      .result p {
        margin-bottom: 0;
      }
      .fine {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .hidden {
        display: none !important;
      }
      footer {
        border-top: 1px solid var(--line);
        padding: 26px 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      @media (max-width: 800px) {
        .hero {
          grid-template-columns: 1fr;
        }
        .filters {
          grid-template-columns: repeat(2, 1fr);
        }
        .cards {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 570px) {
        .shell {
          padding: 0 16px;
        }
        .topinner {
          min-height: 74px;
        }
        .logo {
          width: 137px;
        }
        .tools {
          gap: 5px;
        }
        .tools select,
        .tools button {
          padding: 0 5px;
          min-width: 55px;
          font-size: 0.86rem;
        }
        .hero {
          gap: 18px;
        }
        .filters,
        .cards,
        .row {
          grid-template-columns: 1fr;
        }
        .choicegrid {
          grid-template-columns: 1fr;
        }
        .choice span {
          min-height: 60px;
        }
        .actions button {
          min-width: 0;
          flex: 1;
        }
        .summary {
          grid-template-columns: 1fr;
          gap: 2px;
        }
        .summary dd {
          margin-bottom: 10px;
        }
        .cataloghead {
          align-items: start;
        }
        .panel {
          padding: 19px;
        }
      }
    </style>
  </head>

        const f = {};
        ['kind', 'offer', 'region', 'unit', 'avail'].forEach(
          (k) => (f[k] = document.getElementById('f-' + k).value)
        );
        const list = items.filter((i) =>
          Object.keys(f).every((k) => !f[k] || i[k] === f[k])
        );
        document.getElementById('count').textContent = `(${list.length})`;
        document.getElementById('cards').innerHTML = list.length
          ? list
              .map(
                (i) =>
                  `<article class="card"><div class="cardtop"><span class="type">${t(i.kind)} · ${t(i.offer)}</span><span class="demotag">${t('sample')}</span></div><div class="cardbody"><h3>${esc(t('cardTitle')[i.title])}</h3><p class="specs">${esc(t('cardSpec')[i.spec])}</p><p class="specs">${t(i.avail)} · ${regions[i.region][lang]}</p><p class="price">${i.price ? `${t('from')} ${i.price} / ${t(i.unit)}` : t('onRequest')}</p></div><button class="secondary" type="button" data-sample="${i.title}">${t('details')}</button></article>`
              )
              .join('')
          : `<div class="empty">${t('noResults')}</div>`;
        document.querySelectorAll('[data-sample]').forEach(
          (b) =>
            (b.onclick = () => {
              const i = items[+b.dataset.sample];
              alert(
                `${t('sample')}: ${t('cardTitle')[i.title]}\n${t('cardSpec')[i.spec]}\n${t('previewNote')}`
              );
            })
        );
      }
      function categories() {
        const service = data.offer === 'works';
        return service
          ? ['drillService', 'geoService']
          : ['drill', 'excavator', 'compressor', 'transport'];
      }
      function stepBody() {
        if (result)
          return `<div class="result" role="status"><h2>${t('resultTitle')}</h2><p>${t('resultText')}</p></div><div class="actions"><button class="secondary" id="again" type="button">${t('again')}</button><button class="primary" id="toCatalog" type="button">${t('catalog')}</button></div>`;
        if (step === 1)
          return `<h2>${t('step1')}</h2><p>${t('choose')}</p><div class="choicegrid">${[
            ['rent', 'rentEquipment'],
            ['sale', 'sellEquipment'],
            ['works', 'provideService'],
          ]
            .map(
              ([v, k]) =>
                `<label class="choice"><input type="radio" name="offer" value="${v}" ${data.offer === v ? 'checked' : ''}><span>${t(k)}</span></label>`
            )
            .join(
              ''
            )}</div><div class="help"><h3>${t('helpTitle')}</h3><p>${t('helpText')}</p><button class="secondary" id="helpButton" type="button">${t('helpButton')}</button>${helpOpen ? `<p class="note">${t('helpResult')}</p>` : ''}</div>`;
        if (step === 2)
          return `<h2>${t('step2')}</h2><div class="stack"><div class="field"><label for="category">${t('category')}</label><select id="category" name="category">${opt('', t('chooseCategory'), data.category)}${categories()
            .map((k) => opt(k, t(k), data.category))
            .join(
              ''
            )}</select><p class="error" id="err-category" hidden></p></div>${field('title', t('name'), t('namePlaceholder'))}${field('city', t('city'), t('cityPlaceholder'))}<div class="row">${field('price', t('price'), '', 'number', 'min="0" step="any"')}<div class="field"><label for="currency">${t('currency')}</label><select id="currency" name="currency">${['KZT', 'USD', 'CNY'].map((k) => opt(k, k, data.currency)).join('')}</select></div></div><p class="hint">${t('priceHint')}</p><div class="field"><label for="unit">${t('unit')}</label><select id="unit" name="unit">${(data.offer === 'sale' ? ['item'] : ['shift', 'hour', 'day', 'meter', 'object']).map((k) => opt(k, t(k), data.unit)).join('')}</select></div><div class="field"><label for="conditions">${t('condition')} (${t('optional')})</label><textarea id="conditions" name="conditions" placeholder="${esc(t('conditionPlaceholder'))}">${esc(data.conditions)}</textarea></div><div id="conditional"></div><p class="note">${t('draft')}</p></div>`;
        if (step === 3)
          return `<h2>${t('step3')}</h2><div class="stack">${field('contactName', t('contactName'))}${field('company', `${t('company')} (${t('optional')})`)}${field('phone', t('phone'), t('phonePlaceholder'), 'tel', 'autocomplete="off"')}<fieldset class="field" style="border:0;padding:0;margin:0"><legend>${t('contactPolicy')}</legend><div class="choicegrid" style="grid-template-columns:1fr 1fr"><label class="choice"><input type="radio" name="publish" value="yes" ${data.publish === 'yes' ? 'checked' : ''}><span>${t('publishContact')}</span></label><label class="choice"><input type="radio" name="publish" value="no" ${data.publish === 'no' ? 'checked' : ''}><span>${t('privateContact')}</span></label></div><p class="error" id="err-publish" hidden></p></fieldset><p class="note">${t('phoneWarning')}</p></div>`;
        return `<h2>${t('step4')}</h2><p class="note">${t('previewNote')}</p><dl class="summary">${previewRows()}</dl><p class="fine">${t('phoneWarning')}</p>`;
      }
      function previewRows() {
        const rows = [
          ['offerType', t(data.offer)],
          ['category', data.category ? t(data.category) : '—'],
          ['name', data.title],
          ['city', data.city],
          [
            'price',
            data.price
              ? `${data.price} ${data.currency} / ${t(data.unit)}`
              : t('onRequest'),
          ],
          ['condition', data.conditions || '—'],
        ];
        if (data.category === 'drill' || data.category === 'drillService') {
          rows.push(['method', data.method ? t(data.method) : t('unknown')]);
          if (data.diameter) rows.push(['diameter', data.diameter]);
          if (data.depth) rows.push(['depth', data.depth]);
        }
        if (data.category === 'excavator') {
          if (data.bucket) rows.push(['bucket', data.bucket]);
          if (data.mass) rows.push(['mass', data.mass]);
        }
        rows.push(
          ['contactName', data.contactName],
          ['company', data.company || '—'],
          ['phone', data.phone],
          [
            'contactPolicy',
            data.publish === 'yes' ? t('publishContact') : t('privateContact'),
          ]
        );
        return rows
          .map(
            ([label, value]) =>
              `<dt>${t(label)}</dt><dd style="white-space:pre-wrap">${esc(value)}</dd>`
          )
          .join('');
      }
      function conditional() {
        const box = document.getElementById('conditional');
        if (!box) return;
        let html = '';
        if (data.category === 'drill' || data.category === 'drillService')
          html = `<div class="stack"><div class="field"><label for="method">${t('method')} (${t('optional')})</label><select id="method" name="method">${opt('', t('unknown'), data.method)}${['core', 'rc', 'auger'].map((k) => opt(k, t(k), data.method)).join('')}</select><p class="hint">${t('methodHint')}</p></div><div class="row">${field('diameter', `${t('diameter')} (${t('optional')})`, '', 'number', 'min="0"')}${field('depth', `${t('depth')} (${t('optional')})`, '', 'number', 'min="0"')}</div><p class="hint">${t('depthHint')}</p></div>`;
        if (data.category === 'excavator')
          html = `<div class="row">${field('bucket', `${t('bucket')} (${t('optional')})`, '', 'number', 'min="0" step="any"')}${field('mass', `${t('mass')} (${t('optional')})`, '', 'number', 'min="0" step="any"')}</div>`;
        box.innerHTML = html;
        box
          .querySelectorAll('input,select')
          .forEach((el) => el.addEventListener('input', update));
      }
      function update(e) {
        const el = e.target;
        data[el.name] = el.value;
        if (el.name === 'offer') {
          data.category = '';
          clearTechnical();
          data.unit = data.offer === 'sale' ? 'item' : 'shift';
          step = 1;
          save();
          renderSubmit();
          return;
        }
        if (el.name === 'category') {
          document.getElementById('err-category').hidden = true;
          clearTechnical();
          save();
          conditional();
          return;
        }
        if (!['contactName', 'company', 'phone', 'publish'].includes(el.name))
          save();
        const err = document.getElementById('err-' + el.name);
        if (err) err.hidden = true;
      }
      function clearTechnical() {
        for (const key of ['method', 'diameter', 'depth', 'bucket', 'mass'])
          data[key] = '';
      }
      function validate() {
        const keys =
          step === 2
            ? ['category', 'title', 'city']
            : step === 3
              ? ['contactName', 'phone', 'publish']
              : [];
        let first = null;
        for (const k of keys) {
          let msg = '';
          if (!String(data[k]).trim())
            msg = k === 'publish' ? t('confirm') : t('required');
          if (
            k === 'phone' &&
            data.phone &&
            !/^\+\d[\d\s()\-]{6,}$/.test(data.phone.trim())
          )
            msg = t('invalidPhone');
          const err = document.getElementById('err-' + k);
          if (err) {
            err.textContent = msg;
            err.hidden = !msg;
          }
          if (msg && !first)
            first =
              document.getElementById(k) ||
              document.querySelector(`[name="${k}"]`);
        }
        if (
          step === 2 &&
          data.price &&
          (isNaN(+data.price) || +data.price <= 0)
        ) {
          const err = document.getElementById('err-price');
          err.textContent = t('invalidPrice');
          err.hidden = false;
          first ||= document.getElementById('price');
        }
        if (step === 2) {
          const technical =
            data.category === 'excavator'
              ? ['bucket', 'mass']
              : data.category === 'drill' || data.category === 'drillService'
                ? ['diameter', 'depth']
                : [];
          for (const key of technical) {
            if (
              data[key] &&
              (!Number.isFinite(+data[key]) || +data[key] <= 0)
            ) {
              const err = document.getElementById('err-' + key);
              err.textContent = t('invalidTechnical');
              err.hidden = false;
              first ||= document.getElementById(key);
            }
          }
        }
        if (first) {
          first.focus();
          return false;
        }
        return true;
      }
      function renderSubmit() {
        const root = document.getElementById('submit');
        root.innerHTML = `<div class="flow">${result ? '' : `<div class="stepcount">${t('step')} ${step} ${t('of')} 4</div><div class="progress" aria-label="${t('step')} ${step} ${t('of')} 4">${[1, 2, 3, 4].map((n) => `<span class="${n <= step ? 'on' : ''}"></span>`).join('')}</div>`}<div class="panel">${stepBody()}${result ? '' : `<div class="actions">${step > 1 ? `<button class="secondary" id="back" type="button">${t('back')}</button>` : '<span></span>'}<button class="primary sulfur" id="next" type="button">${step === 4 ? t('send') : t('next')}</button></div>`}</div></div>`;
        root
          .querySelectorAll('input,select,textarea')
          .forEach((el) => el.addEventListener('input', update));
        conditional();
        const hb = document.getElementById('helpButton');
        if (hb)
          hb.onclick = () => {
            helpOpen = !helpOpen;
            renderSubmit();
          };
        const back = document.getElementById('back');
        if (back)
          back.onclick = () => {
            step--;
            renderSubmit();
            window.scrollTo(0, 0);
          };
        const next = document.getElementById('next');
        if (next)
          next.onclick = () => {
            if (!validate()) return;
            if (step < 4) {
              step++;
              renderSubmit();
              window.scrollTo(0, 0);
            } else {
              result = true;
              renderSubmit();
              window.scrollTo(0, 0);
            }
          };
        const again = document.getElementById('again');
        if (again)
          again.onclick = () => {
            data = blank();
            sessionStorage.removeItem('marketplace-demo-draft');
            step = 1;
            result = false;
            renderSubmit();
          };
        const to = document.getElementById('toCatalog');
        if (to) to.onclick = () => selectView('catalog');
      }
      function render() {
        chrome();
        if (view === 'catalog') catalog();
        else renderSubmit();
      }
      document.getElementById('catalogTab').onclick = () =>
        selectView('catalog');
      document.getElementById('submitTab').onclick = () => selectView('submit');
      document.getElementById('lang').onchange = (e) => {
        lang = e.target.value;
        render();
      };
      document.getElementById('theme').onclick = () => {
        theme = theme === 'light' ? 'dark' : 'light';
        document.body.dataset.theme = theme;
        render();
      };
      render();
    </script>
  </body>
</html>
